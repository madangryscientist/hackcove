$schema: "../../.moon/cache/schemas/project.json"

# How Storybook and the docs find the themes. Each task runs the package.json script of its name.
tasks:
  typecheck:
    command: "bun run typecheck"
    inputs: ["**/*"]
  lint:
    command: "bun run lint"
    inputs: ["**/*"]
  test:
    command: "bun run test"
    inputs: ["**/*"]
