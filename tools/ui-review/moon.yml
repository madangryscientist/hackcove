$schema: "../../.moon/cache/schemas/project.json"

# The engine behind .github/workflows/ui-review.yml. Each task runs the package.json script of its name.
tasks:
  typecheck:
    command: "bun run typecheck"
    inputs: ["**/*"]
  lint:
    command: "bun run lint"
    inputs: ["**/*"]
  # test/review.test.ts reads the root AGENTS.md; test/fixtures.ts runs loadContext on the repo,
  # which reads ui-react's src/index.ts and palette.json.
  test:
    command: "bun run test"
    inputs:
      - "**/*"
      - "/AGENTS.md"
      - "/packages/ui-react/src/index.ts"
      - "/packages/ui-react/palette.json"
  check:
    command: "bun run check"
    options:
      cache: false
  review:
    command: "bun run review"
    options:
      cache: false
