$schema: "../../.moon/cache/schemas/project.json"

# Storybook for the components, and the visual check. Each task runs the package.json script of its
# name (`e2e` runs `test:e2e`, `visual-upload` runs `visual:upload`).
dependsOn:
  - "ui-react"
  - "themes-shared"

# moon does not hash a dependency's files, so they are listed here (node_modules, dist and the
# other build output are left out by .moon/tasks/all.yml).
fileGroups:
  deps:
    - "/packages/ui-react/**/*"
    - "/packages/themes-shared/**/*"
  # The site's docs sections name every story file and decide the sidebar and the visual groups.
  sections:
    - "/apps/hack-cove-site/src/content/components/**/*"

tasks:
  storybook:
    command: "bun run storybook"
    preset: "server"
  build:
    command: "bun run build"
    inputs: ["**/*", "@group(deps)", "@group(sections)", "/themes/*.css"]
    outputs: ["storybook-static"]
    deps: ["^:build"]
  typecheck:
    command: "bun run typecheck"
    inputs: ["**/*", "@group(deps)"]
  lint:
    command: "bun run lint"
    inputs: ["**/*", "@group(deps)"]
  # scripts/visual-plan.test.ts and visual-shots.test.ts read the theme files (themeFiles, readRepo).
  test:
    command: "bun run test"
    inputs: ["**/*", "@group(deps)", "@group(sections)", "/themes/*.css"]
  # Playwright against the built Storybook, in every theme.
  e2e:
    command: "bun run test:e2e"
    deps: ["~:build"]
    options:
      cache: false
  # The visual check: plans against the merge-base, captures each picked group, totals them
  # (scripts/visual.ts). What it compares lives outside any project, so it is never cached.
  visual:
    command: "bun run visual"
    deps: ["~:build"]
    options:
      cache: false
  visual-upload:
    command: "bun run visual:upload"
    deps: ["~:build"]
    options:
      cache: false
