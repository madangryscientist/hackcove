$schema: "../../.moon/cache/schemas/project.json"

# The hack-cove.com Astro site and its /ui/ component docs. Each task runs the package.json script
# of its name (`e2e` runs `test:e2e`).
dependsOn:
  - "ui-react"
  - "themes"
  - "themes-shared"

# moon does not hash a dependency's files, so they are listed here (node_modules, dist and the
# other build output are left out by .moon/tasks/all.yml). The docs pages are built from the
# Storybook stories, so those are read too.
fileGroups:
  deps:
    - "/packages/ui-react/**/*"
    - "/themes/**/*"
    - "/packages/themes-shared/**/*"
    - "/apps/storybook/src/**/*"

tasks:
  dev:
    command: "bun run dev"
    preset: "server"
  # The component reference (src/generated/props.json) from ui-react's source. Never cached; it
  # rewrites the same bytes when nothing changed, so the tasks after it still hit the cache.
  props:
    command: "bun run props"
    inputs:
      - "scripts/**/*"
      - "/packages/ui-react/src/**/*"
      - "/packages/ui-react/tsconfig*.json"
    outputs: ["src/generated/props.json", "src/generated/types.json"]
    options:
      cache: false
  # BUILD_COMMIT is an input, so a build for another commit is never a cache hit that ships the
  # previous commit's sha in the build-commit meta.
  build:
    command: "bun run build"
    inputs: ["**/*", "@group(deps)", "$BUILD_COMMIT"]
    outputs: ["dist"]
    deps: ["~:props", "^:build"]
  preview:
    command: "bun run preview"
    deps: ["~:build"]
    preset: "server"
  typecheck:
    command: "bun run typecheck"
    inputs: ["**/*", "@group(deps)"]
    deps: ["~:props", "^:build"]
  lint:
    command: "bun run lint"
    # The testing config this project's .oxlintrc.json extends: another project's files.
    inputs:
      [
        "**/*",
        "@group(deps)",
        "/packages/oxlint-testing/.oxlintrc.json",
        "/packages/oxlint-testing/plugin.js",
      ]
    deps: ["~:props", "^:build"]
  # Depends on build: test/build-commit.dist.test.ts reads dist/.
  test:
    command: "bun run test"
    inputs: ["**/*", "@group(deps)"]
    deps: ["~:props", "~:build", "^:build"]
  deploy:
    command: "bun run deploy"
    deps: ["~:build"]
    options:
      cache: false
  # The post-deploy smoke suite: Playwright requests (no browser) against SMOKE_BASE_URL, a live host
  # that changes outside this repo, so it is never cached. Run it after every production deploy:
  # SMOKE_EXPECT_COMMIT=$(git rev-parse HEAD) SMOKE_BASE_URL=https://hack-cove.com bunx moon run hack-cove-site:smoke
  smoke:
    command: "bun run smoke"
    options:
      cache: false
  # Playwright against the built site, in every theme. Cached on what the run reads: the specs and
  # playwright.config.ts (in **/*), everything build hashes, since the specs run against its dist, and
  # Storybook's e2e/serve.ts, which serves it. The server is a loopback static one started per run,
  # and the Playwright version is in bun.lock. OS fonts are not an input: the specs measure boxes and
  # overflow, not pixels, so a spec that differs between machines is a bug to fix. `--force` re-runs it.
  e2e:
    command: "bun run test:e2e"
    inputs: ["**/*", "@group(deps)", "/apps/storybook/e2e/serve.ts"]
    deps: ["~:build"]
