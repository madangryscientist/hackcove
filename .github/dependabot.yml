version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Our own packages move by an architect's bump ticket on a new 0.x minor, not by Dependabot.
      - dependency-name: "@hackcove/*"
      - dependency-name: "@slashsuite/*"
