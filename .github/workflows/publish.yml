name: Publish

# Manual only: Jacobus decides when a release goes out. The default is a dry run.
# `nx release` versions only the projects that changed since their last tag (conventional commits),
# writes their changelogs, refreshes bun.lock (scripts/release-version-actions.cjs), commits and tags the release, pushes, creates a GitHub release and publishes.
# Publishing authenticates with npm trusted publishing (OIDC): no token, no OTP. Each package needs a
# trusted publisher on npmjs.com pointing at this workflow file, repository madangryscientist/hackcove
# and the environment below. The one exception is a package's first publish: npm cannot attach a trusted
# publisher to a package that does not exist yet, so a project with no release tag is released by the
# "First release" step with an NPM_TOKEN secret on the environment. See docs/releasing.md,
# "First publish of a new package". A renamed package is the same case with a tag: it carries its
# predecessor's tag but is not on npm yet, so it is released by conventional commits with the token
# ("Release (renamed projects)"; docs/releasing.md, "Renaming a package").
on:
  workflow_dispatch:
    inputs:
      project:
        description: Leave empty to release every changed project in one dispatch. Set it only to release one project on its own (ui-react, themes), e.g. a re-publish after a failure.
        type: string
        default: ""
      dry_run:
        description: Dry run (versions, changelogs and publishes nothing; no commit, tag, push or release)
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    # A release never talks to Nx Cloud. Its gate may restore a task's outputs from the shared moon
    # remote cache (read only, see the Gate step), the same bytes main's CI built from the same inputs.
    env:
      NX_NO_CLOUD: "true"
    permissions:
      contents: write # the release commit and tags, pushed with GITHUB_TOKEN, and the GitHub release
      id-token: write # the OIDC token npm exchanges for a short-lived publish credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # nx release reads the history since each project's last tag
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Trusted publishing needs npm 11.5.1 or newer; nx.json sets cli.packageManager to npm so
      # `nx release` shells out to `npm publish`, which is the client that speaks OIDC.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@^11.5.1 && npm --version

      - run: bun install --frozen-lockfile

      # A releasable project (nx.json release.projects) falls in one of three sets, computed from tags
      # and from npm, never from a list:
      #   new      no <project>@<version> tag: its first publish, at the version on disk.
      #   renamed  tagged, but its package name is not on npm: a rename whose predecessor's last tag was
      #            copied to the new name. Released by conventional commits, authenticated by the token.
      #   tagged   tagged and on npm: released by conventional commits through OIDC.
      # The token check runs before anything is versioned, tagged or pushed.
      - name: Pick the new, renamed and tagged projects
        id: projects
        env:
          PROJECT: ${{ inputs.project }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          on_npm() {
            local out
            if out=$(npm view "$1" name 2>&1); then return 0; fi
            if grep -q E404 <<<"$out"; then return 1; fi
            echo "::error::Could not ask npm whether $1 exists: $out"
            exit 1
          }
          patterns=$(jq -r '.release.projects | join(",")' nx.json)
          releasable=$(bunx nx show projects -p "$patterns" --json | jq -r '.[]')
          if [ -z "$releasable" ]; then
            echo "::error::No releasable project (nx.json release.projects)."
            exit 1
          fi
          if [ -n "$PROJECT" ] && ! grep -qx -- "$PROJECT" <<<"$releasable"; then
            echo "::error::$PROJECT is not a releasable project. Releasable: $(paste -sd' ' <<<"$releasable")"
            exit 1
          fi
          tagged=() renamed=() new=()
          for project in ${PROJECT:-$releasable}; do
            if [ -z "$(git tag -l "$project@*")" ]; then
              new+=("$project")
              continue
            fi
            root=$(bunx nx show project "$project" --json | jq -r .root)
            if on_npm "$(jq -r .name "$root/package.json")"; then tagged+=("$project"); else renamed+=("$project"); fi
          done
          tagged=$(IFS=,; echo "${tagged[*]}")
          renamed=$(IFS=,; echo "${renamed[*]}")
          new=$(IFS=,; echo "${new[*]}")
          echo "tagged=$tagged" | tee -a "$GITHUB_OUTPUT"
          echo "renamed=$renamed" | tee -a "$GITHUB_OUTPUT"
          echo "new=$new" | tee -a "$GITHUB_OUTPUT"
          if [ -n "$new$renamed" ] && [ "$HAS_NPM_TOKEN" != "true" ]; then
            echo "::error::Project(s) that npm cannot trust yet: new (no release tag) [$new], renamed (tagged, not on npm) [$renamed]. Their first publish needs an NPM_TOKEN secret on the npm-publish environment (docs/releasing.md \"First publish of a new package\"), or set the project input to release only an already-published project."
            exit 1
          fi

      # The gate reads the shared remote cache (.moon/workspace.yml `remote:`) with the read token
      # and never writes it: main's CI seeds the cache, a release does not. A hit restores the
      # task's outputs exactly as main's CI built them from the same inputs.
      - name: Gate
        env:
          MOON_REMOTE_TOKEN: ${{ secrets.MOON_CACHE_READ_TOKEN }}
        run: |
          bun run format:check
          bunx moon run --concurrency 3 :typecheck :lint :test :build :pack-check

      # A new project's first publish, at the version already in its package.json. Each one gets its
      # own `nx release <that version> --first-release`: the explicit specifier is the on-disk version,
      # so nothing is bumped (without it, conventional commits would bump it); `--first-release` makes
      # Nx fall back to disk where there is no tag, start the changelog at the first commit and skip the
      # "does it exist on npm" check. It tags <project>@<version>, writes the changelog, pushes and
      # creates the GitHub release. This is the only step that sees NPM_TOKEN; it is written to an
      # .npmrc outside the checkout that the step removes on exit.
      - name: First release (new projects, NPM_TOKEN)
        if: steps.projects.outputs.new != ''
        env:
          NEW: ${{ steps.projects.outputs.new }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/first-release.npmrc"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          (umask 077 && printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPM_CONFIG_USERCONFIG")
          for project in ${NEW//,/ }; do
            root=$(bunx nx show project "$project" --json | jq -r .root)
            version=$(jq -r .version "$root/package.json")
            args=("$version" --first-release --projects "$project" --yes)
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            bunx nx release "${args[@]}"
          done

      # A renamed project: its predecessor's last tag was copied to the new name, so conventional commits
      # decide the bump and the changelog continues from that tag, but the package is not on npm yet and
      # OIDC cannot publish it. The same token handling as the first release; the only other step that
      # sees NPM_TOKEN.
      - name: Release (renamed projects, NPM_TOKEN)
        if: steps.projects.outputs.renamed != ''
        env:
          RENAMED: ${{ steps.projects.outputs.renamed }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/renamed-release.npmrc"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          (umask 077 && printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPM_CONFIG_USERCONFIG")
          args=(--projects "$RENAMED" --yes)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          bunx nx release "${args[@]}"

      # Projects that already have a tag and are on npm: conventional commits decide the bump, and publishing
      # authenticates through OIDC. No token is in this step's environment.
      - name: Release (tagged projects, OIDC)
        if: steps.projects.outputs.tagged != ''
        env:
          TAGGED: ${{ steps.projects.outputs.tagged }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--projects "$TAGGED" --yes)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          bunx nx release "${args[@]}"
