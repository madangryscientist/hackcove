name: CI

# Runs the gate on every pull request and on pushes to main. It uses the plain `pull_request`
# trigger, so a fork's pull request runs with a read-only token and no secrets. Never switch it to
# `pull_request_target`. The visual check is not part of CI: it needs a separate checkout and a
# private server.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Nx runs with its local cache only: NX_NO_CLOUD keeps any run from opening an Nx Cloud pipeline
    # execution (HC-227). The cache is kept between runs with actions/cache. GitHub scopes a cache
    # to the ref that wrote it: a pull request reads its own and its base branch's (main) caches and
    # writes only its own, and main cannot read a pull request's, so a branch can never poison main's.
    # e2e is never cached (cache: false), so it runs for real on every commit.
    env:
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # Nx 23 keeps its cache and the database that indexes it under ~/.nx/<workspace id>/ (cache,
      # databases), not in .nx/cache; they have to be restored together, so the whole of ~/.nx is
      # cached. Key: OS, ref, commit. A new commit never finds its own key, so it restores the newest
      # cache of the same ref, then the newest of main, and saves its own at the end.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nx
          key: nx-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.ref }}-
            nx-${{ runner.os }}-refs/heads/main-

      - run: bunx nx run-many -t typecheck lint test build pack-check

      - run: bun run format:check

      - run: bunx playwright install --with-deps chromium firefox webkit

      - run: bunx nx e2e storybook
