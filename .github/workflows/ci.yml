name: CI

# Runs the gate on every pull request and on pushes to main. It uses the plain `pull_request`
# trigger, so a fork's pull request runs with a read-only token and no secrets. Never switch it to
# `pull_request_target`. The visual check is not part of CI: it needs a separate checkout and a
# private server.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # moon runs with its local cache only; there is no remote cache. The cache (.moon/cache) is kept
    # between runs with actions/cache. GitHub scopes a cache to the ref that wrote it: a pull request
    # reads its own and its base branch's (main) caches and writes only its own, and main cannot read
    # a pull request's, so a branch can never poison main's. e2e is never cached (cache: false), so it
    # runs for real on every commit.
    env:
      # In a pull request moon diffs the head against the base branch before any task runs, even for
      # a plain `moon run`, and this shallow checkout has no `main`, so the gate would fail with
      # "ambiguous argument 'main'". `moon run` picks no task by that diff, so the base is HEAD
      # itself: an empty diff and no history to fetch.
      MOON_BASE: HEAD
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # Key: OS, ref, commit. A new commit never finds its own key, so it restores the newest cache of
      # the same ref, then the newest of main, and saves its own.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .moon/cache
          key: moon-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            moon-${{ runner.os }}-${{ github.ref }}-
            moon-${{ runner.os }}-refs/heads/main-

      # Three tasks at once: moon's default of one per core is too much for a shared runner.
      - run: bunx moon run --concurrency 3 :typecheck :lint :test :build :pack-check

      - run: bun run format:check

      - run: bunx playwright install --with-deps chromium firefox webkit

      - run: bunx moon run storybook:e2e
