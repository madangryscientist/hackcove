name: CI

# Runs the gate on every pull request and on pushes to main. It uses the plain `pull_request`
# trigger, so a fork's pull request runs with a read-only token and no secrets. Never switch it to
# `pull_request_target`. The visual check is not part of CI: it needs a separate checkout and a
# private server.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Nx Cloud remote cache (workspace nxCloudId in nx.json; anonymous access is "none"). A push to
    # main writes the shared cache with the read-write token; a pull request gets the read token,
    # which Nx Cloud scopes to a per-PR cache, so a branch can never poison main's. A fork's PR has
    # no secrets and runs uncached.
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'push' && secrets.NX_CLOUD_ACCESS_TOKEN || secrets.NX_CLOUD_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bunx nx run-many -t typecheck lint test build pack-check

      - run: bun run format:check

      - run: bunx playwright install --with-deps chromium firefox webkit

      - run: bunx nx e2e storybook
