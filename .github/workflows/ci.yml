name: CI

# Runs the gate on every pull request and on pushes to main. It uses the plain `pull_request`
# trigger, so a fork's pull request runs with a read-only token and no secrets. Never switch it to
# `pull_request_target`. The visual check is not part of CI: it needs a separate checkout and a
# private server.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # moon reads and writes the shared remote cache (.moon/workspace.yml `remote:`). Every request
    # needs a token. Only a push to main writes: the job enters the `moon-cache-write` environment,
    # which GitHub lets only `main` use, and that environment alone holds MOON_CACHE_WRITE_TOKEN. A
    # pull request gets no environment and runs with the read token: it reads main's results, and its
    # own uploads are refused (moon logs a WARN per task and carries on), so a branch can never poison
    # main's cache. A fork's pull request gets no secrets: moon's first read is a 401, it logs one WARN,
    # turns the remote cache off and runs every task. Never make the write token a plain repository
    # secret, which a same-repo pull request could read. e2e is never cached (cache: false), so it runs
    # for real on every commit.
    environment: ${{ github.event_name == 'push' && 'moon-cache-write' || '' }}
    env:
      # In a pull request moon diffs the head against the base branch before any task runs, even for
      # a plain `moon run`, and this shallow checkout has no `main`, so the gate would fail with
      # "ambiguous argument 'main'". `moon run` picks no task by that diff, so the base is HEAD
      # itself: an empty diff and no history to fetch.
      MOON_BASE: HEAD
      MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # Three tasks at once: moon's default of one per core is too much for a shared runner.
      - run: bunx moon run --concurrency 3 :typecheck :lint :test :build :pack-check

      - run: bun run format:check

      - run: bunx playwright install --with-deps chromium firefox webkit

      - run: bunx moon run storybook:e2e
